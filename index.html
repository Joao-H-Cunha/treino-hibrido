<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Treino Híbrido</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07090b">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  bg: '#07090b', card: '#0f1317', line: '#1c242b', hl: '#00d4ff', mute: '#7d8b94'
}, fontFamily: { sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] } } } };
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { background: #07090b; color: #eef3f5; -webkit-tap-highlight-color: transparent; }
  .glow { box-shadow: 0 0 14px rgba(0, 212, 255, 0.55); }
  .flash { animation: flash 0.8s ease-in-out 4; }
  @keyframes flash { 0%,100% { background-color: #0f1317; } 50% { background-color: #06414f; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; background-color: #06414f; } }
  .day.active { border-color: #00d4ff; background: #06202a; }
  input[type=number]::-webkit-inner-spin-button { display: none; }
</style>
</head>
<body class="font-sans min-h-screen">
<main class="mx-auto max-w-xl px-4 pt-5 pb-48">
  <header class="mb-5">
    <h1 class="text-2xl font-extrabold tracking-tight">Treino <span class="text-hl">híbrido</span></h1>
    <p id="subtitle" class="text-sm text-mute mt-1"></p>
  </header>
  <nav id="week" class="grid grid-cols-7 gap-1.5 mb-5" aria-label="Semana"></nav>
  <section id="panel" aria-live="polite"></section>
</main>

<footer id="timer" class="fixed bottom-0 inset-x-0 border-t border-line bg-card">
  <div class="mx-auto max-w-xl px-4 pt-3" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));">
    <div class="flex items-center justify-between mb-2">
      <div>
        <p class="text-xs text-mute">Descanso entre séries</p>
        <p id="clock" class="text-3xl font-bold tabular-nums">00:00</p>
      </div>
      <p id="clockMsg" class="text-sm text-mute text-right">Escolha um tempo</p>
    </div>
    <div class="grid grid-cols-5 gap-2">
      <button data-sec="45" class="tbtn rounded-xl bg-bg border border-line py-3 font-semibold active:scale-95">45s</button>
      <button data-sec="60" class="tbtn rounded-xl bg-bg border border-line py-3 font-semibold active:scale-95">60s</button>
      <button data-sec="90" class="tbtn rounded-xl bg-bg border border-line py-3 font-semibold active:scale-95">90s</button>
      <button data-sec="120" class="tbtn rounded-xl bg-bg border border-line py-3 font-semibold active:scale-95">2min</button>
      <button id="stop" class="rounded-xl border border-line py-3 font-semibold text-mute active:scale-95">Parar</button>
    </div>
  </div>
</footer>

<script>
const DAYS = [
  { short: 'Seg', title: 'Full Body A', tag: 'Musculação', kind: 'strength', plan: 'A' },
  { short: 'Ter', title: 'Corrida · Squad Javali', tag: 'Cardio', kind: 'cardio', note: 'Treino com o Squad Javali, intensidade conforme a programação.' },
  { short: 'Qua', title: 'Full Body B', tag: 'Musculação', kind: 'strength', plan: 'B' },
  { short: 'Qui', title: 'Corrida · Squad Javali', tag: 'Cardio', kind: 'cardio', note: 'Treino com o Squad Javali. Se preferir, faça uma corrida leve a moderada de 30 a 45 minutos, conforme a recuperação. Sem cardio obrigatório após a musculação.' },
  { short: 'Sex', title: 'Full Body C', tag: 'Musculação', kind: 'strength', plan: 'C' },
  { short: 'Sáb', title: 'Descanso', tag: 'Descanso', kind: 'rest', note: 'Dia de descanso. Durma bem e deixe o corpo se recuperar.' },
  { short: 'Dom', title: 'Descanso', tag: 'Descanso', kind: 'rest', note: 'Descanso. Uma corrida leve no domingo pode substituir uma das corridas da semana, mas não é obrigatória.' }
];
const FULL = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const MUSCLES = {
  A: ['Full Body', 'Peito', 'Costas'],
  B: ['Full Body', 'Costas', 'Posteriores'],
  C: ['Full Body', 'Superiores']
};
const INFO = {
  A: { dur: '45–60 min' },
  B: { dur: '45–60 min' },
  C: { dur: '50–60 min', extra: 'Se a corrida de quinta foi muito intensa, ajuste o trabalho de pernas hoje.' }
};

/* Cada grupo é UM exercício; os itens são as variações selecionáveis. */
const GROUPS = {
  aSupino: ['Supino Reto na Máquina', 'Supino Reto com Barra Livre', 'Supino Reto com Halteres'],
  aPuxada: ['Puxada Alta com Barra Aberta', 'Puxada Alta com Pegada Neutra'],
  aLeg: ['Leg Press 45°', 'Leg Press Horizontal'],
  aDesenv: ['Desenvolvimento na Máquina', 'Desenvolvimento com Halteres'],
  aTriceps: ['Tríceps na Polia com Barra Reta', 'Tríceps na Polia com Barra W', 'Tríceps na Polia com Corda'],
  aRosca: ['Rosca Direta com Barra W Livre', 'Rosca Direta com Barra W na Polia'],
  bRemada: ['Remada Sentada na Máquina', 'Remada Sentada na Polia Baixa'],
  bInclinado: ['Supino Inclinado na Máquina', 'Supino Inclinado com Halteres'],
  bFlexora: ['Mesa Flexora', 'Cadeira Flexora'],
  bLateral: ['Elevação Lateral com Halteres', 'Elevação Lateral na Máquina'],
  bScott: ['Rosca Scott na Máquina', 'Rosca Scott com Barra W no Banco'],
  bAcima: ['Tríceps Acima da Cabeça na Polia com Corda', 'Tríceps Acima da Cabeça com Halter'],
  cPress: ['Chest Press na Máquina', 'Supino Reto com Barra Livre', 'Supino Reto com Halteres'],
  cRemada: ['Remada Articulada na Máquina', 'Remada com Apoio para o Peito'],
  cExtensora: ['Cadeira Extensora na Máquina'],
  cFlexora: ['Mesa Flexora', 'Cadeira Flexora'],
  cInverso: ['Peck Deck Inverso na Máquina', 'Crucifixo Inverso com Halteres e Tronco Inclinado'],
  cMartelo: ['Rosca Martelo com Halteres', 'Rosca Martelo com Corda na Polia'],
  cCorda: ['Tríceps na Polia Alta com Corda']
};
const PLANS = {
  A: [
    { g: 'aSupino', label: 'Supino Reto', sets: 3, reps: '8–12' },
    { g: 'aPuxada', label: 'Puxada Alta na Frente', sets: 3, reps: '8–12' },
    { g: 'aLeg', label: 'Leg Press', sets: 3, reps: '10–12' },
    { g: 'aDesenv', label: 'Desenvolvimento de Ombros', sets: 2, reps: '8–12' },
    { g: 'aTriceps', label: 'Tríceps na Polia', sets: 2, reps: '10–15' },
    { g: 'aRosca', label: 'Rosca Direta', sets: 2, reps: '10–12' }
  ],
  B: [
    { g: 'bRemada', label: 'Remada Sentada', sets: 3, reps: '8–12' },
    { g: 'bInclinado', label: 'Supino Inclinado', sets: 3, reps: '8–12' },
    { g: 'bFlexora', label: 'Flexora', sets: 3, reps: '10–15' },
    { g: 'bLateral', label: 'Elevação Lateral', sets: 3, reps: '12–15' },
    { g: 'bScott', label: 'Rosca Scott', sets: 2, reps: '10–12' },
    { g: 'bAcima', label: 'Tríceps Acima da Cabeça', sets: 2, reps: '10–15' }
  ],
  C: [
    { g: 'cPress', label: 'Supino Reto / Chest Press', sets: 3, reps: '8–12' },
    { g: 'cRemada', label: 'Remada Articulada', sets: 3, reps: '8–12' },
    { g: 'cExtensora', label: 'Cadeira Extensora', sets: 2, reps: '10–15' },
    { g: 'cFlexora', label: 'Flexora', sets: 2, reps: '10–15' },
    { g: 'cInverso', label: 'Crucifixo Inverso', sets: 2, reps: '12–15' },
    { g: 'cMartelo', label: 'Rosca Martelo', sets: 2, reps: '10–12' },
    { g: 'cCorda', label: 'Tríceps na Corda', sets: 2, reps: '10–15' }
  ]
};

/* Nomes antigos: se a variação nova ainda não tem carga, mostra a carga do nome anterior. */
const LEGACY = {
  'Supino Reto com Barra Livre': 'Supino Reto (Barra)',
  'Puxada Alta com Barra Aberta': 'Puxada Alta na Frente',
  'Desenvolvimento na Máquina': 'Desenvolvimento de Ombros na Máquina',
  'Tríceps na Polia com Barra Reta': 'Tríceps na Polia',
  'Rosca Direta com Barra W Livre': 'Rosca Direta',
  'Supino Inclinado com Halteres': 'Supino Inclinado (Halteres)',
  'Mesa Flexora': 'Mesa Flexora (Deitado)',
  'Cadeira Flexora': 'Cadeira Flexora (Sentado)',
  'Elevação Lateral com Halteres': 'Elevação Lateral (Halteres)',
  'Elevação Lateral na Máquina': 'Elevação Lateral no Cabo',
  'Tríceps Acima da Cabeça na Polia com Corda': 'Tríceps Acima da Cabeça na Polia',
  'Chest Press na Máquina': 'Chest Press (Máquina)',
  'Remada Articulada na Máquina': 'Remada Articulada',
  'Cadeira Extensora na Máquina': 'Cadeira Extensora',
  'Rosca Martelo com Halteres': 'Rosca Martelo (Halteres)',
  'Rosca Martelo com Corda na Polia': 'Rosca Martelo na Polia com Corda',
  'Tríceps na Polia Alta com Corda': 'Tríceps na Corda'
};

const $week = document.getElementById('week');
const $panel = document.getElementById('panel');
const $subtitle = document.getElementById('subtitle');

const today = (new Date().getDay() + 6) % 7;
let selected = today;

function weekId() {
  const d = new Date(); d.setDate(d.getDate() - today);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
const WID = weekId();
let state = { choices: {}, checks: {}, loads: {}, week: WID };
try {
  const raw = localStorage.getItem('treino-hipertrofia-v2');
  if (raw) state = Object.assign(state, JSON.parse(raw));
  if (state.week !== WID) { state.checks = {}; state.week = WID; }
} catch (e) {}
function save() { try { localStorage.setItem('treino-hipertrofia-v2', JSON.stringify(state)); } catch (e) {} }

const choiceOf = g => Math.min(state.choices[g] || 0, GROUPS[g].length - 1);
const loadOf = name => {
  if (state.loads[name] !== undefined) return state.loads[name];
  const old = LEGACY[name];
  return old && state.loads[old] !== undefined ? state.loads[old] : '';
};
const checkKey = (day, g, s) => WID + ':' + day + ':' + g + ':' + s;
const isDone = (day, g, s) => !!state.checks[checkKey(day, g, s)];

function progress(day) {
  const plan = PLANS[DAYS[day].plan]; if (!plan) return null;
  let done = 0, total = 0;
  plan.forEach(e => { for (let s = 0; s < e.sets; s++) { total++; if (isDone(day, e.g, s)) done++; } });
  return { done, total };
}

function renderWeek() {
  $week.innerHTML = DAYS.map((d, i) => {
    const p = progress(i);
    const finished = p && p.done === p.total;
    return `<button data-day="${i}" class="day ${i === selected ? 'active' : ''} rounded-xl border border-line bg-card px-0.5 py-2.5 flex flex-col items-center gap-1" aria-label="${FULL[i]}: ${d.title}">
      <span class="text-xs ${i === today ? 'text-hl font-bold' : 'text-mute'}">${d.short}</span>
      <span class="text-lg leading-none">${d.kind === 'strength' ? '🏋️' : d.kind === 'cardio' ? '🏃' : '🌙'}</span>
      <span class="text-[10px] leading-none ${finished ? 'text-hl font-bold' : 'text-mute'}">${finished ? 'feito' : d.plan ? d.plan : d.kind === 'cardio' ? 'run' : 'off'}</span>
    </button>`;
  }).join('');
}

function renderPanel() {
  const d = DAYS[selected];
  $subtitle.textContent = FULL[selected] + (selected === today ? ' (hoje)' : '');
  const chips = (MUSCLES[d.plan] || [d.tag]).map(m => `<span class="rounded-full border border-hl/60 bg-[#06202a] px-3 py-1 text-xs font-bold uppercase tracking-wide text-hl">${m}</span>`).join('');
  let html = `<div class="mb-3 flex flex-wrap items-center gap-x-3 gap-y-2"><h2 class="text-2xl font-extrabold uppercase">${d.title}</h2><div class="flex flex-wrap gap-2">${chips}</div></div>`;

  if (d.kind !== 'strength') {
    $panel.innerHTML = html + `<div class="rounded-2xl border border-line bg-card p-5 text-mute leading-relaxed">${d.note}</div>`;
    return;
  }

  const p = progress(selected);
  const info = INFO[d.plan];
  html += `<p class="text-sm text-mute mb-1">${PLANS[d.plan].length} exercícios · <span class="text-hl font-semibold">${p.total} séries no total</span> · ${info.dur}</p>
  <p class="text-xs text-mute mb-4">Descanso sugerido: cerca de 2 min nos compostos e 60–90 s nos isolados.${info.extra ? ' ' + info.extra : ''}</p>
  <div class="rounded-xl border border-hl bg-[#06202a] p-3.5 text-sm mb-4 glow">
    <strong class="text-hl">REGRA DE HIPERTROFIA:</strong> Controle Absoluto. Fase Concêntrica Explosiva (1-2s) + Fase Excêntrica Cadenciada (3s lentos na descida). Suba a carga se atingir o teto de repetições da série.
  </div>
  <div class="mb-5">
    <div class="flex justify-between text-xs text-mute mb-1.5"><span>Séries concluídas</span><span id="pcount">${p.done}/${p.total}</span></div>
    <div class="h-2 rounded-full bg-line overflow-hidden"><div id="pbar" class="h-full bg-hl transition-all" style="width:${p.done / p.total * 100}%"></div></div>
  </div>`;

  html += PLANS[d.plan].map((e, n) => {
    const g = e.g, idx = choiceOf(g), name = GROUPS[g][idx];
    const opts = GROUPS[g].map((o, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${o}</option>`).join('');
    const circles = Array.from({ length: e.sets }, (_, s) => {
      const on = isDone(selected, g, s);
      return `<button data-g="${g}" data-s="${s}" aria-pressed="${on}" aria-label="Série ${s + 1}" class="set h-11 w-11 rounded-full border-2 font-bold text-sm active:scale-90 transition ${on ? 'bg-hl border-hl text-bg glow' : 'border-line text-mute'}">${s + 1}</button>`;
    }).join('');
    const swap = GROUPS[g].length > 1 ? `
      <div class="flex gap-2">
        <select data-swap="${g}" aria-label="Escolher variação do exercício" class="flex-1 min-w-0 rounded-lg border border-line bg-bg px-2.5 py-2 text-sm text-mute">${opts}</select>
        <button data-cycle="${g}" class="shrink-0 rounded-lg border border-line bg-bg px-3.5 py-2 text-sm font-semibold text-hl active:scale-95">⇄ Alternar</button>
      </div>` : '';
    return `<article class="rounded-2xl border border-line bg-card p-4 mb-3.5">
      <p class="text-xs text-mute mb-0.5">Exercício ${n + 1} · ${e.label}</p>
      <h3 class="text-lg font-bold leading-snug mb-1">${name}</h3>
      <p class="text-sm mb-1"><span class="text-hl font-semibold">${e.sets} séries</span> x <span class="text-hl font-semibold">${e.reps}</span> repetições</p>
      <div class="flex items-center justify-between gap-3 my-3">
        <div class="flex gap-2 flex-wrap">${circles}</div>
        <label class="shrink-0 text-right">
          <span class="block text-[11px] text-mute mb-1">Carga Atual (kg)</span>
          <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" value="${loadOf(name)}" data-load="${name}" class="w-20 rounded-lg border border-line bg-bg px-2 py-2 text-center text-base font-semibold text-hl focus:outline-none focus:border-hl">
        </label>
      </div>${swap}
    </article>`;
  }).join('');
  $panel.innerHTML = html;
}

$week.addEventListener('click', e => {
  const b = e.target.closest('[data-day]'); if (!b) return;
  selected = +b.dataset.day; renderWeek(); renderPanel();
});
$panel.addEventListener('change', e => {
  if (e.target.dataset.swap) { state.choices[e.target.dataset.swap] = +e.target.value; save(); renderPanel(); }
});
$panel.addEventListener('input', e => {
  const name = e.target.dataset.load; if (!name) return;
  state.loads[name] = e.target.value;
  save();
});
$panel.addEventListener('click', e => {
  const c = e.target.closest('[data-cycle]');
  if (c) { const g = c.dataset.cycle; state.choices[g] = (choiceOf(g) + 1) % GROUPS[g].length; save(); renderPanel(); return; }
  const b = e.target.closest('.set'); if (!b) return;
  const key = checkKey(selected, b.dataset.g, b.dataset.s);
  const on = !state.checks[key];
  state.checks[key] = on; save();
  b.setAttribute('aria-pressed', on);
  b.className = 'set h-11 w-11 rounded-full border-2 font-bold text-sm active:scale-90 transition ' + (on ? 'bg-hl border-hl text-bg glow' : 'border-line text-mute');
  const p = progress(selected);
  document.getElementById('pcount').textContent = p.done + '/' + p.total;
  document.getElementById('pbar').style.width = (p.done / p.total * 100) + '%';
  renderWeek();
  if (on) startTimer(lastSeconds);
});

/* Cronômetro regressivo */
const $clock = document.getElementById('clock');
const $msg = document.getElementById('clockMsg');
const $timer = document.getElementById('timer');
let endAt = 0, tick = null, lastSeconds = 90, lastLeft = -1, audioCtx = null;

function beep(ms, freq) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; g.gain.value = 0.08;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}

const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function startTimer(sec) {
  lastSeconds = sec; endAt = Date.now() + sec * 1000;
  $timer.classList.remove('flash'); clearInterval(tick);
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('border-hl', +b.dataset.sec === sec));
  $msg.textContent = 'Descansando…'; $msg.className = 'text-sm text-mute text-right';
  lastLeft = -1; update(); tick = setInterval(update, 250);
}
function update() {
  const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  $clock.textContent = fmt(left);
  const warn = left > 0 && left <= 5;
  $clock.classList.toggle('text-hl', warn);
  if (warn) {
    $msg.textContent = 'A série volta em ' + left + 's. Prepare-se!';
    $msg.className = 'text-sm text-hl font-semibold text-right';
    if (left !== lastLeft) { beep(90, 880); if (navigator.vibrate) navigator.vibrate(60); }
  }
  lastLeft = left;
  if (left === 0) {
    clearInterval(tick);
    beep(400, 1200);
    $timer.classList.add('flash');
    $msg.textContent = 'Descanso finalizado. Próxima série!'; $msg.className = 'text-sm text-hl font-semibold text-right';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
}
function stopTimer() {
  clearInterval(tick); $timer.classList.remove('flash'); $clock.classList.remove('text-hl'); $clock.textContent = '00:00';
  $msg.textContent = 'Escolha um tempo'; $msg.className = 'text-sm text-mute text-right';
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('border-hl'));
}
document.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', () => startTimer(+b.dataset.sec)));
document.getElementById('stop').addEventListener('click', stopTimer);

renderWeek(); renderPanel();
</script>
</body>
</html>
